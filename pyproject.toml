[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires local docker infra (postgres/redis/nats)",
    "e2e: boots the full stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "apps/web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # asserts are fine (tests + invariant checks)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
exclude = ["\\.venv", "apps/web", "node_modules"]
