name: agora-sandbox

networks:
  agora_sandbox:
    name: agora_sandbox

volumes:
  agora_pgdata:
  agora_natsdata:
  agora_pipcache:
  agora_web_node_modules:
  agora_web_next:
  agora_artifacts:

services:
  agora-postgres:
    image: postgres:16
    restart: unless-stopped
    networks: [agora_sandbox]
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: ${AGORA_DB_PASSWORD:?set in env file}
      POSTGRES_DB: agora
    volumes:
      - agora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d agora"]
      interval: 5s
      timeout: 3s
      retries: 20

  agora-redis:
    image: redis:7
    restart: unless-stopped
    networks: [agora_sandbox]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  agora-nats:
    image: nats:2.10
    restart: unless-stopped
    command: ["-js"]
    networks: [agora_sandbox]
    volumes:
      - agora_natsdata:/data

  agora-api:
    image: python:3.12-slim
    restart: unless-stopped
    networks: [agora_sandbox]
    working_dir: /app
    depends_on:
      agora-postgres:
        condition: service_healthy
      agora-redis:
        condition: service_healthy
    volumes:
      - ../../..:/app
      - agora_pipcache:/root/.cache/pip
      - agora_artifacts:/var/lib/agora/artifacts
    environment:
      AGORA_ENV: ${AGORA_ENV:-staging}
      AGORA_ARTIFACT_STORE_ROOT: /var/lib/agora/artifacts
      AGORA_ENVIRONMENT_ID: ${AGORA_ENVIRONMENT_ID:?}
      AGORA_DATABASE_URL: postgresql+asyncpg://agora:${AGORA_DB_PASSWORD}@agora-postgres:5432/agora
      AGORA_REDIS_URL: redis://agora-redis:6379/0
      AGORA_NATS_URL: nats://agora-nats:4222
      AGORA_PUBLIC_BASE_URL: ${AGORA_PUBLIC_BASE_URL:?}
      AGORA_CORS_ORIGINS: ${AGORA_CORS_ORIGINS:?}
      AGORA_WORLD_SIGNING_SECRET: ${AGORA_WORLD_SIGNING_SECRET:?}
      AGORA_PASSPORT_SIGNING_SECRET: ${AGORA_PASSPORT_SIGNING_SECRET:?}
      AGORA_WORLD_SIGNING_KEY_ID: ${AGORA_WORLD_SIGNING_KEY_ID:?}
      AGORA_PROVENANCE_CLASS: ${AGORA_PROVENANCE_CLASS:-unknown}
      AGORA_RESEARCH_WINDOW_PRODUCTION_OPTIN: ${AGORA_RESEARCH_WINDOW_PRODUCTION_OPTIN:-false}
      # Unset = the /v1/operator plane refuses everyone (fail closed).
      AGORA_OPERATOR_TOKEN: ${AGORA_OPERATOR_TOKEN:-}
      AGORA_OIDC_ISSUER: ${AGORA_OIDC_ISSUER:-}
      AGORA_OIDC_CLIENT_ID: ${AGORA_OIDC_CLIENT_ID:-}
      AGORA_OIDC_CLIENT_SECRET: ${AGORA_OIDC_CLIENT_SECRET:-}
      AGORA_OIDC_REDIRECT_URI: ${AGORA_OIDC_REDIRECT_URI:-}
    command: >
      bash -lc "pip install -q -r requirements.txt &&
                cd apps/api && alembic upgrade head &&
                exec python -m uvicorn agora_api.main:app --host 0.0.0.0 --port 8700"

  agora-web:
    image: node:22-slim
    restart: unless-stopped
    networks: [agora_sandbox]
    working_dir: /app/apps/web
    depends_on:
      - agora-api
    volumes:
      - ../../..:/app
      - agora_web_node_modules:/app/apps/web/node_modules
      - agora_web_next:/app/apps/web/.next
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_AGORA_API_URL: /agora-api
      AGORA_API_REWRITE_TARGET: http://agora-api:8700
      AGORA_CANONICAL_API_URL: http://agora-api:8700
    command: >
      bash -lc "npm ci --no-audit --no-fund &&
                npm run build &&
                exec npm run start -- --hostname 0.0.0.0 --port 3000"
