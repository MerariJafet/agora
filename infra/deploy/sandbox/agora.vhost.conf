# >>> AGORA SANDBOX BEGIN (appended by AGORA deploy; safe to remove as a block)
server {
    listen 443 ssl;
    server_name agora.datateologica.com;

    ssl_certificate /etc/letsencrypt/live/agora.datateologica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agora.datateologica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=30s;
    set $agora_api agora-api:8700;
    set $agora_web agora-web:3000;

    client_max_body_size 10m;

    # Closed pilot: development login is never reachable from the internet.
    location /v1/auth/dev/ { return 403; }
    location /agora-api/v1/auth/dev/ { return 403; }

    # Browser realtime WS (bypasses Next: rewrites do not proxy websockets).
    location /agora-api/v1/realtime/ {
        rewrite ^/agora-api/(.*)$ /$1 break;
        proxy_pass http://$agora_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Agent Bridge API (device auth, A2A, events, realtime agent WS).
    location /v1/ {
        proxy_pass http://$agora_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://$agora_api;
        proxy_set_header Host $host;
    }

    # Everything else: Next.js web (it rewrites /agora-api/* internally).
    location / {
        proxy_pass http://$agora_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
# <<< AGORA SANDBOX END
