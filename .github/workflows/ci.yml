name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      AGORA_ENV: test
      AGORA_ENVIRONMENT_ID: isolated-local
      AGORA_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGORA_PROVENANCE_CLASS: test
      AGORA_DATABASE_URL: postgresql+asyncpg://agora:agora_dev_password@localhost:5434/agora_test_ci
      AGORA_REDIS_URL: redis://localhost:6380/15
      AGORA_OUTBOX_ENABLED: "false"
      AGORA_RESEARCH_SCHEDULER_ENABLED: "false"
      AGORA_NATS_URL: nats://localhost:4222
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora_dev_password
          POSTGRES_DB: agora_test_ci
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U agora -d agora_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e apps/api -e bridge
      - name: Published metrics match the tree
        # Every count the public docs quote is derived from the working tree by
        # scripts/collect_metrics.py. This fails the build when METRICS.json or
        # an injected <!-- AGORA:METRICS --> block drifts from reality.
        run: .venv/bin/python scripts/collect_metrics.py --check
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Typecheck
        run: .venv/bin/mypy apps/api/agora_api bridge/agora_bridge
      - name: Migrate (empty database)
        run: .venv/bin/alembic -c apps/api/alembic.ini upgrade head
      - name: Unit + integration + security tests
        run: .venv/bin/python -m pytest tests/unit tests/integration tests/security -q
      - name: Native TOKOIN deterministic and adversarial tests
        run: |
          .venv/bin/pip install -r native/requirements.txt
          .venv/bin/pytest -c native/pyproject.toml --confcutdir=native native/tests -q
      - name: Native consensus time policy
        run: .venv/bin/python native/tools/time_policy.py
      - name: Native monetary campaign (100000 sequences)
        run: PYTHONPATH=native .venv/bin/python native/tools/monetary_campaign.py --sequences 100000 --seed 20260909 --output /tmp/tokoin-monetary-ci
      - name: Preserve native campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokoin-monetary-evidence
          path: /tmp/tokoin-monetary-ci
      - name: Start NATS (JetStream, matches dev compose)
        # A GitHub service container cannot pass command args, and the e2e
        # realtime gateway needs a reachable NATS before uvicorn will boot.
        run: |
          docker run -d --name agora-ci-nats -p 4222:4222 nats:2.10 -js
          for i in $(seq 1 20); do
            (exec 3<>/dev/tcp/127.0.0.1/4222) 2>/dev/null && exit 0
            sleep 1
          done
          echo "NATS did not come up" >&2; docker logs agora-ci-nats; exit 1
      - name: E2E (Genesis Agent)
        run: .venv/bin/python -m pytest tests/e2e -q
      - name: Dependency audit (fail on known critical)
        run: .venv/bin/pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  tokoin-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/tokoin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/tokoin/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run test:contracts
      - run: npm run test:preflight
      - run: npm run test:bundle
      - run: npm run audit:static
      - run: npm run bundle:verify -- ../../audit/launch-2026-09-09/tokoin-candidate-bundle.json
      - run: npm audit --audit-level=high
