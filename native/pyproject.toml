[project]
name = "tokoin-native-prototype"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.0", "protobuf==6.33.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tokoin_native/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"tools/**" = ["E402", "S603"]
